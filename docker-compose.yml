services:
  # ==============================================================================
  # Laravel Web Application (Nginx + PHP-FPM)
  # ==============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:80"
    environment:
      APP_NAME: "${APP_NAME:-SOV Summit}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost}"
      
      # Database
      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: "${DB_HOST:-db}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-sov_summit}"
      DB_USERNAME: "${DB_USERNAME:-sov_user}"
      DB_PASSWORD: "${DB_PASSWORD:-sov_secret}"

      # Cache, Sessions & Queue
      CACHE_STORE: "${CACHE_STORE:-redis}"
      SESSION_DRIVER: "${SESSION_DRIVER:-redis}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-redis}"
      REDIS_CLIENT: "${REDIS_CLIENT:-phpredis}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-redis_secret}"
      REDIS_PORT: "${REDIS_PORT:-6379}"

      # Filesystem & Logging
      FILESYSTEM_DISK: "${FILESYSTEM_DISK:-spaces}"
      LOG_CHANNEL: "${LOG_CHANNEL:-stack}"
      LOG_LEVEL: "${LOG_LEVEL:-error}"

      # DigitalOcean Spaces Storage
      DO_ACCESS_KEY_ID: "${DO_ACCESS_KEY_ID:-}"
      DO_SECRET_ACCESS_KEY: "${DO_SECRET_ACCESS_KEY:-}"
      DO_DEFAULT_REGION: "${DO_DEFAULT_REGION:-fra1}"
      DO_BUCKET: "${DO_BUCKET:-localrydes-media}"
      DO_ENDPOINT: "${DO_ENDPOINT:-https://fra1.digitaloceanspaces.com}"
      DO_URL: "${DO_URL:-}"
      DO_PREFIX: "${DO_PREFIX:-sob-summit}"
      DO_THROW: "${DO_THROW:-true}"

      # AWS S3 Storage
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
      AWS_BUCKET: "${AWS_BUCKET:-}"
      AWS_ENDPOINT: "${AWS_ENDPOINT:-}"
      AWS_URL: "${AWS_URL:-}"
      AWS_USE_PATH_STYLE_ENDPOINT: "${AWS_USE_PATH_STYLE_ENDPOINT:-false}"

      # Mail Settings
      MAIL_MAILER: "${MAIL_MAILER:-smtp}"
      MAIL_HOST: "${MAIL_HOST:-}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_ENCRYPTION: "${MAIL_ENCRYPTION:-tls}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-info@sov-summit.com}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-SOV Summit}"

      # AI Services
      AI_SERVICE_PROVIDER: "${AI_SERVICE_PROVIDER:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-3.5-turbo}"
      OPENAI_MAX_TOKENS: "${OPENAI_MAX_TOKENS:-200}"
      OPENAI_TEMPERATURE: "${OPENAI_TEMPERATURE:-0.7}"

      # Auto run migrations & optimize on boot
      AUTORUN_MIGRATIONS: "${AUTORUN_MIGRATIONS:-true}"
      SKIP_OPTIMIZE: "${SKIP_OPTIMIZE:-false}"
    env_file:
      - path: .env
        required: false
    volumes:
      - app_storage:/var/www/html/storage
      - app_bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/up"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - sov_network
      - dokploy-network
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.sov-app.rule=Host(`${APP_DOMAIN:-localhost}`)"
    #   - "traefik.http.routers.sov-app.entrypoints=websecure"
    #   - "traefik.http.routers.sov-app.tls=true"
    #   - "traefik.http.routers.sov-app.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.sov-app.loadbalancer.server.port=80"

  # ==============================================================================
  # Queue Worker
  # ==============================================================================
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    environment:
      APP_NAME: "${APP_NAME:-SOV Summit}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost}"
      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: "${DB_HOST:-db}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-sov_summit}"
      DB_USERNAME: "${DB_USERNAME:-sov_user}"
      DB_PASSWORD: "${DB_PASSWORD:-sov_secret}"
      CACHE_STORE: "${CACHE_STORE:-redis}"
      SESSION_DRIVER: "${SESSION_DRIVER:-redis}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-redis}"
      REDIS_CLIENT: "${REDIS_CLIENT:-phpredis}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-redis_secret}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      FILESYSTEM_DISK: "${FILESYSTEM_DISK:-spaces}"

      # DigitalOcean Spaces Storage
      DO_ACCESS_KEY_ID: "${DO_ACCESS_KEY_ID:-}"
      DO_SECRET_ACCESS_KEY: "${DO_SECRET_ACCESS_KEY:-}"
      DO_DEFAULT_REGION: "${DO_DEFAULT_REGION:-fra1}"
      DO_BUCKET: "${DO_BUCKET:-localrydes-media}"
      DO_ENDPOINT: "${DO_ENDPOINT:-https://fra1.digitaloceanspaces.com}"
      DO_URL: "${DO_URL:-}"
      DO_PREFIX: "${DO_PREFIX:-sob-summit}"
      DO_THROW: "${DO_THROW:-true}"

      # Mail Settings
      MAIL_MAILER: "${MAIL_MAILER:-smtp}"
      MAIL_HOST: "${MAIL_HOST:-}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_ENCRYPTION: "${MAIL_ENCRYPTION:-tls}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-info@sov-summit.com}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-SOV Summit}"

      # AI Services
      AI_SERVICE_PROVIDER: "${AI_SERVICE_PROVIDER:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-3.5-turbo}"
      OPENAI_MAX_TOKENS: "${OPENAI_MAX_TOKENS:-200}"
      OPENAI_TEMPERATURE: "${OPENAI_TEMPERATURE:-0.7}"

      AUTORUN_MIGRATIONS: "false"
      SKIP_OPTIMIZE: "true"
    env_file:
      - path: .env
        required: false
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sov_network

  # ==============================================================================
  # Laravel Task Scheduler (Cron)
  # ==============================================================================
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment:
      APP_NAME: "${APP_NAME:-SOV Summit}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost}"
      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: "${DB_HOST:-db}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-sov_summit}"
      DB_USERNAME: "${DB_USERNAME:-sov_user}"
      DB_PASSWORD: "${DB_PASSWORD:-sov_secret}"
      CACHE_STORE: "${CACHE_STORE:-redis}"
      SESSION_DRIVER: "${SESSION_DRIVER:-redis}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-redis}"
      REDIS_CLIENT: "${REDIS_CLIENT:-phpredis}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-redis_secret}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      FILESYSTEM_DISK: "${FILESYSTEM_DISK:-spaces}"

      # DigitalOcean Spaces Storage
      DO_ACCESS_KEY_ID: "${DO_ACCESS_KEY_ID:-}"
      DO_SECRET_ACCESS_KEY: "${DO_SECRET_ACCESS_KEY:-}"
      DO_DEFAULT_REGION: "${DO_DEFAULT_REGION:-fra1}"
      DO_BUCKET: "${DO_BUCKET:-localrydes-media}"
      DO_ENDPOINT: "${DO_ENDPOINT:-https://fra1.digitaloceanspaces.com}"
      DO_URL: "${DO_URL:-}"
      DO_PREFIX: "${DO_PREFIX:-sob-summit}"
      DO_THROW: "${DO_THROW:-true}"

      AUTORUN_MIGRATIONS: "false"
      SKIP_OPTIMIZE: "true"
    env_file:
      - path: .env
        required: false
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - sov_network

  # ==============================================================================
  # MySQL Database (Optional if using Dokploy's Managed Database)
  # ==============================================================================
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-sov_summit}"
      MYSQL_USER: "${DB_USERNAME:-sov_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-sov_secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-sov_root_secret}"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sov_network

  # ==============================================================================
  # Redis Cache & Queue Backend
  # ==============================================================================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis_secret}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - sov_network

# ==============================================================================
# Persistent Volumes & Networks
# ==============================================================================
volumes:
  app_storage:
    name: sov_summit_storage
  app_bootstrap_cache:
    name: sov_summit_bootstrap_cache
  db_data:
    name: sov_summit_db_data
  redis_data:
    name: sov_summit_redis_data

networks:
  sov_network:
    driver: bridge
  dokploy-network:
    external: true
