<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SOV Summit — Upcoming</title>
    <meta name="description" content="SOV Summit is coming soon." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
        :root {
            --ink: #0b0b0c;
            --paper: #f4f1ea;
            --accent: #c8461e;
            --muted: #6b6a66;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: var(--paper);
            color: var(--ink);
            font-family: "Fraunces", Georgia, serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: grid;
            grid-template-rows: auto 1fr auto;
            min-height: 100vh;
            padding: clamp(1.5rem, 3vw, 3rem);
            background:
                radial-gradient(1200px 600px at 90% -10%, rgba(200, 70, 30, 0.08), transparent 60%),
                radial-gradient(900px 500px at -10% 110%, rgba(11, 11, 12, 0.06), transparent 60%),
                var(--paper);
        }

        header, footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: "JetBrains Mono", monospace;
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
        }

        header .mark {
            color: var(--ink);
            font-weight: 500;
        }

        main {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 2rem;
            padding: 4rem 0;
        }

        .eyebrow {
            font-family: "JetBrains Mono", monospace;
            font-size: 0.78rem;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: var(--accent);
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
        }

        .eyebrow::before {
            content: "";
            width: 28px;
            height: 1px;
            background: var(--accent);
        }

        h1 {
            font-family: "Fraunces", serif;
            font-weight: 400;
            font-size: clamp(3rem, 10vw, 8.5rem);
            line-height: 0.95;
            letter-spacing: -0.02em;
            margin: 0;
            max-width: 14ch;
        }

        h1 em {
            font-style: italic;
            color: var(--accent);
            font-weight: 400;
        }

        .lede {
            max-width: 44ch;
            font-size: clamp(1.05rem, 1.4vw, 1.25rem);
            line-height: 1.55;
            color: var(--muted);
            margin: 0;
        }

        .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 2.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(11, 11, 12, 0.15);
            max-width: 720px;
        }

        .meta div {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .meta .label {
            font-family: "JetBrains Mono", monospace;
            font-size: 0.7rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .meta .value {
            font-family: "Fraunces", serif;
            font-size: 1.15rem;
        }

        footer .status {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        footer .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 4px rgba(200, 70, 30, 0.15);
            animation: pulse 2.4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.85); }
        }

        @media (max-width: 640px) {
            .meta { gap: 1.5rem; }
            header, footer { font-size: 0.7rem; }
        }
    </style>
</head>
<body>
    <header>
        <span class="mark">SOV / Summit</span>
        <span>MMXXVI</span>
    </header>

    <main>
        <span class="eyebrow">Upcoming</span>
        <h1>Something <em>new</em> is on the horizon.</h1>
        <p class="lede">
            SOV Summit is being prepared. A gathering of ideas, people, and work
            worth doing — details to follow shortly.
        </p>

        <div class="meta">
            <div>
                <span class="label">Status</span>
                <span class="value">In preparation</span>
            </div>
            <div>
                <span class="label">Announcement</span>
                <span class="value">Coming soon</span>
            </div>
            <div>
                <span class="label">Contact</span>
                <span class="value">hello@sov-summit</span>
            </div>
        </div>
    </main>

    <footer>
        <span class="status"><span class="dot"></span> Live updates pending</span>
        <span>&copy; SOV Summit</span>
    </footer>
</body>
</html>
